<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>COUNTRY HOUSE | App Repartidor</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --brand-green: #0e754a;
            --brand-green-light: #18b775;
            --brand-whatsapp: #25D366;
            --bg-main: #070c14;
            --bg-surface: #0e1726;
            --bg-card: #131f33;
            --bg-input: #080d17;
            --border-subtle: #1e2c47;
            --text-white: #ffffff;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-white);
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .driver-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0.85rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .driver-title {
            font-size: 1.05rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .status-pill {
            font-size: 0.72rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 9999px;
            background: rgba(37, 211, 102, 0.2);
            color: #25D366;
        }

        .driver-container {
            max-width: 550px;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .driver-gps-box {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn-gps-toggle {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            border-radius: 9999px;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
        }

        .btn-gps-toggle.active {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
        }

        .map-wrapper {
            width: 100%;
            height: 250px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            overflow: hidden;
        }

        .order-delivery-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .order-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 0.5rem;
        }

        .btn-nav-action {
            height: 44px;
            border-radius: 9999px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            flex: 1;
        }

        .btn-waze { background: #33ccff; color: #000; }
        .btn-maps { background: #4285f4; color: #fff; }
        .btn-wa-client { background: #25D366; color: #fff; }
        .btn-delivered { background: #059669; color: #fff; width: 100%; height: 48px; border: none; border-radius: 9999px; font-weight: 800; font-size: 0.92rem; cursor: pointer; }

        .filter-tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .filter-tab-btn.active {
            background: #10b981;
            color: #fff;
            border-color: #10b981;
        }
    </style>
</head>
<body>

    <header class="driver-header">
        <div class="driver-title">
            <span>📦🛵</span>
            <span>Alisto & Reparto • Country House</span>
        </div>
        <span class="status-pill" id="driverStatusPill">● Operador en Turno</span>
    </header>

    <main class="driver-container">
        <!-- GPS Transmitter -->
        <section class="driver-gps-box">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 0.84rem; font-weight: 800;">📡 Transmisor GPS en Vivo</span>
                <span id="gpsCoordLabel" style="font-size: 0.72rem; color: #34d399; font-weight: 700;">GPS Listo</span>
            </div>

            <button class="btn-gps-toggle" id="btnGpsToggle" onclick="toggleGpsRepartidor()">
                <span>📍 Iniciar Transmisión GPS en Vivo</span>
            </button>

            <div id="driverMap" class="map-wrapper"></div>
        </section>

        <!-- Active Deliveries -->
        <section>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem;">
                <h2 style="font-size: 0.95rem; font-weight: 900;">📦 Pedidos Asignados para Entrega</h2>
                <button onclick="cargarPedidosRepartidor()" style="background: var(--bg-surface); border: 1px solid var(--border-subtle); color: var(--text-muted); font-size: 0.7rem; font-weight: 800; padding: 3px 8px; border-radius: 9999px; cursor: pointer;">🔄 Actualizar</button>
            </div>

            <!-- Filter Tabs -->
            <div style="display: flex; gap: 0.4rem; margin-bottom: 0.85rem; overflow-x: auto; padding-bottom: 3px;">
                <button class="filter-tab-btn active" id="tabBtnTODOS" onclick="setFiltroModalidad('TODOS', this)">📦 Todos (<span id="countBadgeTodos">0</span>)</button>
                <button class="filter-tab-btn" id="tabBtnDOMICILIO" onclick="setFiltroModalidad('DOMICILIO', this)">🛵 Domicilio (<span id="countBadgeDomicilio">0</span>)</button>
                <button class="filter-tab-btn" id="tabBtnRECOGER" onclick="setFiltroModalidad('RECOGER', this)">🏬 Pickup (<span id="countBadgeRecoger">0</span>)</button>
            </div>

            <div id="ordersDeliveryContainer" style="display: flex; flex-direction: column; gap: 0.9rem;">
                <!-- Loaded from Supabase -->
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://brjralkrguufpkzwnlhl.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_p61DQUM4Bg7ktnxLOo76DA_m5dzz5M1';
        let supabaseClient = null;
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch(e) { console.warn(e); }

        let map = null;
        let driverMarker = null;
        let activeGpsWatchId = null;
        let activeGpsOrderId = null;
        let isBroadcasting = false;
        let filtroModalidadActual = 'TODOS';
        let pedidosCache = [];

        function initMap() {
            if (map) return;
            map = L.map('driverMap').setView([10.0020, -84.1150], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            const icon = L.divIcon({
                html: '<div style="font-size:26px; filter:drop-shadow(0 2px 5px rgba(0,0,0,0.5));">🛵</div>',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
            driverMarker = L.marker([10.0020, -84.1150], { icon: icon }).addTo(map);
        }

        function setFiltroModalidad(mod, btn) {
            filtroModalidadActual = mod;
            document.querySelectorAll('.filter-tab-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderizarPedidosHtml();
        }

        function toggleGpsRepartidor() {
            if (!isBroadcasting) {
                const primerEnRuta = pedidosCache.find(p => p.estado === 'EN_RUTA');
                const orderId = primerEnRuta ? primerEnRuta.id : (pedidosCache[0] ? pedidosCache[0].id : null);
                if (!orderId) {
                    alert('No hay pedidos activos para asociar la ruta GPS. Inicia o despacha un pedido primero.');
                    return;
                }
                iniciarGpsParaPedido(orderId);
            } else {
                detenerGpsTransmision();
            }
        }

        function iniciarGpsParaPedido(orderId) {
            if (!navigator.geolocation) return alert('GPS no disponible en este dispositivo');
            const btn = document.getElementById('btnGpsToggle');
            const label = document.getElementById('gpsCoordLabel');

            isBroadcasting = true;
            activeGpsOrderId = orderId;
            if (btn) {
                btn.classList.add('active');
                btn.innerHTML = '<span>🛑 Detener Transmisión GPS</span>';
            }
            if (label) label.innerText = `● Transmitiendo Ruta #${orderId}`;

            if (activeGpsWatchId) navigator.geolocation.clearWatch(activeGpsWatchId);

            activeGpsWatchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    const spd = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 35;

                    if (driverMarker) driverMarker.setLatLng([lat, lng]);
                    if (map) map.panTo([lat, lng]);

                    if (label) label.innerText = `📍 #${orderId}: ${lat.toFixed(4)}, ${lng.toFixed(4)} (${spd} km/h)`;

                    if (supabaseClient && activeGpsOrderId) {
                        supabaseClient.from('rutas_gps_envio').insert([{
                            pedido_id: activeGpsOrderId,
                            repartidor_nombre: 'Repartidor / Alistador Country House',
                            latitud_actual: lat,
                            longitud_actual: lng,
                            minutos_estimados: 12
                        }]).then(() => {}).catch(console.warn);
                    }
                },
                (err) => {
                    console.warn('GPS watch error:', err);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function detenerGpsTransmision() {
            isBroadcasting = false;
            activeGpsOrderId = null;
            if (activeGpsWatchId) {
                navigator.geolocation.clearWatch(activeGpsWatchId);
                activeGpsWatchId = null;
            }
            const btn = document.getElementById('btnGpsToggle');
            const label = document.getElementById('gpsCoordLabel');
            if (btn) {
                btn.classList.remove('active');
                btn.innerHTML = '<span>📍 Iniciar Transmisión GPS en Vivo</span>';
            }
            if (label) label.innerText = '○ GPS Pausado';
        }

        function resolverRutasNavegacion(rawDireccion) {
            if (!rawDireccion) {
                const def = encodeURIComponent('Heredia, Costa Rica');
                return {
                    waze: `https://waze.com/ul?q=${def}&navigate=yes`,
                    maps: `https://www.google.com/maps/dir/?api=1&destination=${def}`,
                    esGpsExacto: false,
                    direccionMostrable: 'Coordinar con cliente'
                };
            }

            const match = rawDireccion.match(/(-?\d{1,2}\.\d{3,})[,\s]+(-?\d{1,3}\.\d{3,})/);
            if (match) {
                const lat = match[1];
                const lng = match[2];
                let direccionLimpia = rawDireccion.replace(/\[GPS:.*?\]/gi, '').replace(/\[Mapa:.*?\]/gi, '').trim();
                if (!direccionLimpia) direccionLimpia = `Ubicación GPS precisa (${lat}, ${lng})`;
                return {
                    waze: `https://waze.com/ul?ll=${lat},${lng}&navigate=yes`,
                    maps: `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`,
                    esGpsExacto: true,
                    direccionMostrable: direccionLimpia,
                    lat,
                    lng
                };
            }

            let direccionLimpia = rawDireccion.replace(/\[.*?\]/gi, '').trim();
            const encoded = encodeURIComponent(direccionLimpia + ', Costa Rica');
            return {
                waze: `https://waze.com/ul?q=${encoded}&navigate=yes`,
                maps: `https://www.google.com/maps/dir/?api=1&destination=${encoded}`,
                esGpsExacto: false,
                direccionMostrable: direccionLimpia || rawDireccion
            };
        }

        async function cargarPedidosRepartidor() {
            if (!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient
                    .from('pedidos')
                    .select('*, detalles_pedido(*, productos(nombre)), metricas_picking(*)')
                    .neq('estado', 'ENTREGADO')
                    .order('creado_en', { ascending: false });

                if (error) throw error;
                pedidosCache = data || [];
                actualizarConteoBadges();
                renderizarPedidosHtml();
            } catch(e) {
                console.warn(e);
            }
        }

        function actualizarConteoBadges() {
            const dom = pedidosCache.filter(p => p.modalidad === 'DOMICILIO').length;
            const rec = pedidosCache.filter(p => p.modalidad === 'RECOGER').length;
            const bTodos = document.getElementById('countBadgeTodos');
            const bDom = document.getElementById('countBadgeDomicilio');
            const bRec = document.getElementById('countBadgeRecoger');
            if (bTodos) bTodos.innerText = pedidosCache.length;
            if (bDom) bDom.innerText = dom;
            if (bRec) bRec.innerText = rec;
        }

        function renderizarPedidosHtml() {
            const container = document.getElementById('ordersDeliveryContainer');
            if (!container) return;

            const lista = pedidosCache.filter(p => {
                if (filtroModalidadActual === 'TODOS') return true;
                return p.modalidad === filtroModalidadActual;
            });

            if (lista.length === 0) {
                container.innerHTML = `
                    <div style="background:var(--bg-card); padding:2.5rem 1rem; text-align:center; border-radius:14px; color:var(--text-dim); border:1px solid var(--border-subtle);">
                        <p style="font-size:2.4rem; margin-bottom:0.4rem;">🎉</p>
                        <p style="font-weight:900; color:var(--text-white); font-size:1rem;">¡Todo listo por aquí!</p>
                        <p style="font-size:0.75rem; margin-top:4px;">No hay pedidos pendientes de alisto o entrega en este filtro.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = lista.map(ord => {
                const nav = resolverRutasNavegacion(ord.direccion_entrega);
                const itemsCount = ord.detalles_pedido ? ord.detalles_pedido.length : 0;
                const metric = (ord.metricas_picking && ord.metricas_picking.length > 0) ? ord.metricas_picking[0] : null;

                // Transcurrido
                const minutosTranscurridos = Math.max(0, Math.floor((Date.now() - new Date(ord.creado_en)) / 60000));
                const horaLlegada = new Date(ord.creado_en).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                // Tiempos alisto
                let alistoTexto = '';
                if (ord.estado === 'EN_ALISTO') {
                    const minAlistando = metric && metric.hora_inicio ? Math.max(1, Math.floor((Date.now() - new Date(metric.hora_inicio)) / 60000)) : 1;
                    alistoTexto = `<span style="color:#c084fc; font-weight:800;">⏱️ Alistando: ~${minAlistando}m</span>`;
                } else if (metric && metric.duracion_segundos > 0) {
                    const m = Math.floor(metric.duracion_segundos / 60);
                    const s = metric.duracion_segundos % 60;
                    alistoTexto = `<span style="color:#34d399; font-weight:700;">⏱️ Alisto: ${m}m ${s}s</span>`;
                }

                const statusBadge = ord.estado === 'EN_ALISTO' 
                    ? `<span style="background:rgba(139,92,246,0.25); color:#c084fc; font-weight:800; font-size:0.72rem; padding:3px 8px; border-radius:6px;">📦 En Alisto</span>`
                    : (ord.estado === 'EN_RUTA' 
                        ? `<span style="background:rgba(249,115,22,0.25); color:#fb923c; font-weight:800; font-size:0.72rem; padding:3px 8px; border-radius:6px;">🛵 En Ruta</span>`
                        : (ord.estado === 'EMPACADO'
                            ? `<span style="background:rgba(16,185,129,0.25); color:#34d399; font-weight:800; font-size:0.72rem; padding:3px 8px; border-radius:6px;">🏬 Listo en Tienda</span>`
                            : `<span style="background:rgba(245,158,11,0.25); color:#f59e0b; font-weight:800; font-size:0.72rem; padding:3px 8px; border-radius:6px;">🟡 Pendiente</span>`));

                let actionButtonHtml = '';
                if (ord.estado === 'PENDIENTE') {
                    actionButtonHtml = `
                        <button class="btn-delivered" style="background:#8b5cf6;" onclick="iniciarAlisto('${ord.id}', ${itemsCount})">
                            ⏱️ Iniciar Alisto en Bodega (${itemsCount} ítems)
                        </button>
                    `;
                } else if (ord.estado === 'EN_ALISTO') {
                    if (ord.modalidad === 'DOMICILIO') {
                        actionButtonHtml = `
                            <button class="btn-delivered" style="background:#f97316;" onclick="finalizarAlistoYSalir('${ord.id}', ${itemsCount})">
                                🛵 Terminar Alisto y Salir En Ruta (GPS Auto)
                            </button>
                        `;
                    } else {
                        actionButtonHtml = `
                            <button class="btn-delivered" style="background:#3b82f6;" onclick="finalizarAlistoPickup('${ord.id}', ${itemsCount})">
                                🏬 Terminar Alisto (Listo para Retiro en Tienda)
                            </button>
                        `;
                    }
                } else if (ord.estado === 'EN_RUTA') {
                    actionButtonHtml = `
                        <div style="display:flex; flex-direction:column; gap:0.4rem;">
                            <div style="background:rgba(249,115,22,0.15); border:1px solid rgba(249,115,22,0.3); padding:0.5rem; border-radius:8px; text-align:center; font-size:0.75rem; color:#fb923c; font-weight:700;">
                                📡 Transmitiendo ubicación satelital en vivo
                            </div>
                            <button class="btn-delivered" style="background:#10b981;" onclick="marcarEntregado('${ord.id}')">
                                ✓ Confirmar Pedido Entregado al Cliente
                            </button>
                        </div>
                    `;
                } else if (ord.estado === 'EMPACADO') {
                    actionButtonHtml = `
                        <button class="btn-delivered" style="background:#10b981;" onclick="marcarEntregado('${ord.id}')">
                            ✓ Confirmar Retiro por el Cliente en Tienda
                        </button>
                    `;
                }

                return `
                    <div class="order-delivery-card">
                        <div class="order-card-head">
                            <div>
                                <div style="font-size:0.95rem; font-weight:900;">#${ord.id} • ${ord.nombre_contacto}</div>
                                <div style="font-size:0.72rem; color:var(--text-muted); margin-top:2px;">
                                    Llegó: <b>${horaLlegada}</b> • <span style="color:#60a5fa; font-weight:700;">⏳ hace ${minutosTranscurridos} min</span>
                                </div>
                            </div>
                            <div style="text-align:right;">
                                <div style="font-weight:900; color:#34d399; font-size:1.05rem;">₡${Number(ord.total_a_pagar).toLocaleString('es-CR')}</div>
                                <div style="margin-top:3px;">${statusBadge}</div>
                            </div>
                        </div>

                        <div style="background:var(--bg-input); padding:0.65rem 0.85rem; border-radius:10px; font-size:0.78rem;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                                <span style="color:${ord.modalidad === 'DOMICILIO' ? '#60a5fa' : '#34d399'}; font-weight:800;">
                                    ${ord.modalidad === 'DOMICILIO' ? '🛵 Entrega a Domicilio' : '🏬 Retiro en Tienda'}
                                </span>
                                ${alistoTexto}
                            </div>
                            <div style="color:var(--text-muted); display:flex; align-items:flex-start; justify-content:space-between; gap:0.5rem;">
                                <div>📍 <b>Dirección:</b> ${nav.direccionMostrable}</div>
                                ${nav.esGpsExacto ? `<span style="background:rgba(16,185,129,0.2); color:#34d399; font-weight:800; font-size:0.68rem; padding:2px 7px; border-radius:9999px; white-space:nowrap;">📍 GPS Exacto</span>` : ''}
                            </div>
                            <div style="color:var(--text-dim); margin-top:3px;">💳 <b>Pago:</b> ${ord.forma_pago} • ⏰ <b>Horario:</b> ${ord.horario_rango}</div>
                            ${ord.notas_cliente ? `<div style="color:#fef08a; margin-top:3px;">📝 <b>Notas:</b> ${ord.notas_cliente}</div>` : ''}
                        </div>

                        ${ord.modalidad === 'DOMICILIO' ? `
                            <div style="display:flex; gap:0.4rem; margin-bottom: 0.75rem;">
                                <a href="${nav.waze}" target="_blank" class="btn-nav-action btn-waze" style="text-decoration:none;">
                                    🚗 Waze ${nav.esGpsExacto ? '📍' : ''}
                                </a>
                                <a href="${nav.maps}" target="_blank" class="btn-nav-action btn-maps" style="text-decoration:none;">
                                    🗺️ Maps ${nav.esGpsExacto ? '📍' : ''}
                                </a>
                                <a href="https://api.whatsapp.com/send?phone=${ord.telefono_contacto}&text=Hola%20${encodeURIComponent(ord.nombre_contacto)},%20soy%20el%20repartidor%20de%20Country%20House,%20voy%20en%20camino%20con%20tu%20pedido%20🛵" target="_blank" class="btn-nav-action btn-wa-client" style="text-decoration:none;">
                                    💬 Contactar
                                </a>
                            </div>
                        ` : `
                            <div style="display:flex; gap:0.4rem; margin-bottom: 0.75rem;">
                                <a href="https://api.whatsapp.com/send?phone=${ord.telefono_contacto}&text=Hola%20${encodeURIComponent(ord.nombre_contacto)},%20tu%20pedido%20de%20Country%20House%20está%20listo%20para%20retirar%20en%20tienda%20🏬" target="_blank" class="btn-nav-action btn-wa-client" style="text-decoration:none; flex:1;">
                                    💬 Avisar al Cliente por WhatsApp
                                </a>
                            </div>
                        `}

                        ${ord.detalles_pedido && ord.detalles_pedido.length > 0 ? `
                            <div style="margin-bottom: 0.75rem; border-top:1px solid var(--border-subtle); padding-top:0.75rem;">
                                <div style="font-size:0.8rem; font-weight:800; color:var(--text-white); margin-bottom:0.5rem; display:flex; justify-content:space-between;">
                                    <span>📦 Checklist de Alisto (${ord.detalles_pedido.filter(i=>i.listo).length}/${ord.detalles_pedido.length})</span>
                                    <span style="color:#60a5fa; font-size:0.7rem;">Toca para marcar listo</span>
                                </div>
                                ${ord.detalles_pedido.map(item => `
                                    <div style="display:flex; align-items:center; justify-content:space-between; background:var(--bg-input); padding:0.5rem 0.75rem; border-radius:8px; margin-bottom:0.3rem; border:1px solid ${item.listo ? 'rgba(52,211,153,0.3)' : 'transparent'};">
                                        <div style="font-size:0.78rem; color:${item.listo ? '#34d399' : 'var(--text-white)'}; text-decoration:${item.listo ? 'line-through' : 'none'};">
                                            <b>${item.cantidad}x</b> ${item.productos?.nombre || 'Producto'}
                                        </div>
                                        <input type="checkbox" ${item.listo ? 'checked' : ''} onchange="toggleItemListo('${item.id}', this.checked)" style="width:19px; height:19px; accent-color:#10b981; cursor:pointer;">
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}

                        ${actionButtonHtml}
                    </div>
                `;
            }).join('');
        }

        async function iniciarAlisto(orderId, totalItems) {
            if (!supabaseClient) return;
            try {
                const ahora = new Date().toISOString();
                await supabaseClient.from('metricas_picking').insert([{
                    pedido_id: orderId,
                    hora_inicio: ahora,
                    cantidad_items: totalItems || 1
                }]);
                await supabaseClient.from('pedidos').update({ estado: 'EN_ALISTO' }).eq('id', orderId);
                cargarPedidosRepartidor();
            } catch(e) { console.error('Error al iniciar alisto:', e); }
        }

        async function finalizarAlistoYSalir(orderId, totalItems) {
            if (!supabaseClient) return;
            try {
                const ahora = new Date();
                // Buscar hora_inicio
                const ord = pedidosCache.find(p => p.id === orderId);
                const metric = (ord && ord.metricas_picking && ord.metricas_picking.length > 0) ? ord.metricas_picking[0] : null;
                const inicio = (metric && metric.hora_inicio) ? new Date(metric.hora_inicio) : ahora;
                const duracionSegundos = Math.max(10, Math.round((ahora - inicio) / 1000));
                const segItem = totalItems > 0 ? (duracionSegundos / totalItems).toFixed(1) : duracionSegundos;

                await supabaseClient.from('metricas_picking').update({
                    hora_fin: ahora.toISOString(),
                    duracion_segundos: duracionSegundos,
                    segundos_por_item: segItem
                }).eq('pedido_id', orderId);

                await supabaseClient.from('pedidos').update({ estado: 'EN_RUTA' }).eq('id', orderId);

                // Iniciar GPS automático
                iniciarGpsParaPedido(orderId);

                cargarPedidosRepartidor();
            } catch(e) { console.error('Error al salir a ruta:', e); }
        }

        async function finalizarAlistoPickup(orderId, totalItems) {
            if (!supabaseClient) return;
            try {
                const ahora = new Date();
                const ord = pedidosCache.find(p => p.id === orderId);
                const metric = (ord && ord.metricas_picking && ord.metricas_picking.length > 0) ? ord.metricas_picking[0] : null;
                const inicio = (metric && metric.hora_inicio) ? new Date(metric.hora_inicio) : ahora;
                const duracionSegundos = Math.max(10, Math.round((ahora - inicio) / 1000));
                const segItem = totalItems > 0 ? (duracionSegundos / totalItems).toFixed(1) : duracionSegundos;

                await supabaseClient.from('metricas_picking').update({
                    hora_fin: ahora.toISOString(),
                    duracion_segundos: duracionSegundos,
                    segundos_por_item: segItem
                }).eq('pedido_id', orderId);

                await supabaseClient.from('pedidos').update({ estado: 'EMPACADO' }).eq('id', orderId);
                cargarPedidosRepartidor();
            } catch(e) { console.error('Error al finalizar alisto pickup:', e); }
        }

        async function marcarEntregado(orderId) {
            if (!supabaseClient) return;
            if (!confirm(`¿Confirmas que el pedido #${orderId} fue entregado exitosamente?`)) return;
            try {
                await supabaseClient.from('pedidos').update({ estado: 'ENTREGADO' }).eq('id', orderId);
                if (activeGpsOrderId === orderId) {
                    detenerGpsTransmision();
                }
                alert(`🎉 ¡Pedido #${orderId} completado y marcado como entregado!`);
                cargarPedidosRepartidor();
            } catch(e) { console.warn(e); }
        }

        async function toggleItemListo(detalleId, listoState) {
            if (!supabaseClient) return;
            try {
                await supabaseClient.from('detalles_pedido').update({ listo: listoState }).eq('id', detalleId);
            } catch(e) { console.error('Error actualizando item:', e); }
        }

        function initRealtime() {
            if (!supabaseClient) return;
            supabaseClient
                .channel('repartidor:pedidos')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, payload => {
                    cargarPedidosRepartidor();
                })
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'detalles_pedido' }, payload => {
                    cargarPedidosRepartidor();
                })
                .subscribe();
        }

        window.onload = () => {
            initMap();
            cargarPedidosRepartidor();
            initRealtime();
        };
    </script>
</body>
</html>
