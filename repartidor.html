<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>COUNTRY HOUSE | App Repartidor</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --brand-green: #0e754a;
            --brand-green-light: #18b775;
            --brand-whatsapp: #25D366;
            --bg-main: #070c14;
            --bg-surface: #0e1726;
            --bg-card: #131f33;
            --bg-input: #080d17;
            --border-subtle: #1e2c47;
            --text-white: #ffffff;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-white);
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .driver-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0.85rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .driver-title {
            font-size: 1.05rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .status-pill {
            font-size: 0.72rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 9999px;
            background: rgba(37, 211, 102, 0.2);
            color: #25D366;
        }

        .driver-container {
            max-width: 550px;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .driver-gps-box {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn-gps-toggle {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            border-radius: 9999px;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
        }

        .btn-gps-toggle.active {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
        }

        .map-wrapper {
            width: 100%;
            height: 250px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            overflow: hidden;
        }

        .order-delivery-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .order-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 0.5rem;
        }

        .btn-nav-action {
            height: 44px;
            border-radius: 9999px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            flex: 1;
        }

        .btn-waze { background: #33ccff; color: #000; }
        .btn-maps { background: #4285f4; color: #fff; }
        .btn-wa-client { background: #25D366; color: #fff; }
        .btn-delivered { background: #059669; color: #fff; width: 100%; height: 48px; border: none; border-radius: 9999px; font-weight: 800; font-size: 0.92rem; cursor: pointer; }
    </style>
</head>
<body>

    <header class="driver-header">
        <div class="driver-title">
            <span>🛵</span>
            <span>Repartidor Country House</span>
        </div>
        <span class="status-pill" id="driverStatusPill">● En Turno</span>
    </header>

    <main class="driver-container">
        <!-- GPS Transmitter -->
        <section class="driver-gps-box">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 0.84rem; font-weight: 800;">📡 Transmisor GPS en Vivo</span>
                <span id="gpsCoordLabel" style="font-size: 0.72rem; color: #34d399; font-weight: 700;">GPS Listo</span>
            </div>

            <button class="btn-gps-toggle" id="btnGpsToggle" onclick="toggleGpsRepartidor()">
                <span>📍 Iniciar Transmisión GPS en Vivo</span>
            </button>

            <div id="driverMap" class="map-wrapper"></div>
        </section>

        <!-- Active Deliveries -->
        <section>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem;">
                <h2 style="font-size: 0.95rem; font-weight: 900;">📦 Pedidos Asignados para Entrega</h2>
                <button onclick="cargarPedidosRepartidor()" style="background: var(--bg-surface); border: 1px solid var(--border-subtle); color: var(--text-muted); font-size: 0.7rem; font-weight: 800; padding: 3px 8px; border-radius: 9999px; cursor: pointer;">🔄 Actualizar</button>
            </div>

            <div id="ordersDeliveryContainer" style="display: flex; flex-direction: column; gap: 0.9rem;">
                <!-- Loaded from Supabase -->
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://brjralkrguufpkzwnlhl.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_p61DQUM4Bg7ktnxLOo76DA_m5dzz5M1';
        let supabaseClient = null;
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch(e) { console.warn(e); }

        let map = null;
        let driverMarker = null;
        let watchId = null;
        let isBroadcasting = false;

        function initMap() {
            if (map) return;
            map = L.map('driverMap').setView([10.0020, -84.1150], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            const icon = L.divIcon({
                html: '<div style="font-size:26px; filter:drop-shadow(0 2px 5px rgba(0,0,0,0.5));">🛵</div>',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
            driverMarker = L.marker([10.0020, -84.1150], { icon: icon }).addTo(map);
        }

        function toggleGpsRepartidor() {
            const btn = document.getElementById('btnGpsToggle');
            const label = document.getElementById('gpsCoordLabel');

            if (!isBroadcasting) {
                if (!navigator.geolocation) return alert('GPS no disponible en este dispositivo');
                isBroadcasting = true;
                btn.classList.add('active');
                btn.innerHTML = '<span>🛑 Detener Transmisión GPS</span>';
                label.innerText = '● Transmitiendo Coordenadas';

                watchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        const spd = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 35;

                        if (driverMarker) driverMarker.setLatLng([lat, lng]);
                        if (map) map.panTo([lat, lng]);

                        label.innerText = `${lat.toFixed(4)}, ${lng.toFixed(4)} • ${spd} km/h`;

                        if (supabaseClient) {
                            supabaseClient.from('rutas_gps_envio').insert([{
                                pedido_id: 'RUTA_ACTIVA',
                                repartidor_nombre: 'Repartidor Country House',
                                latitud_actual: lat,
                                longitud_actual: lng,
                                velocidad_kmh: spd,
                                minutos_estimados: 10
                            }]).catch(console.warn);
                        }
                    },
                    (err) => {
                        alert('Permite el acceso al GPS para transmitir tu ruta a los clientes.');
                        toggleGpsRepartidor();
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                isBroadcasting = false;
                if (watchId) navigator.geolocation.clearWatch(watchId);
                btn.classList.remove('active');
                btn.innerHTML = '<span>📍 Iniciar Transmisión GPS en Vivo</span>';
                label.innerText = '○ GPS Pausado';
            }
        }

        async function cargarPedidosRepartidor() {
            const container = document.getElementById('ordersDeliveryContainer');
            if (!supabaseClient) return;

            try {
                const { data, error } = await supabaseClient
                    .from('pedidos')
                    .select('*')
                    .eq('modalidad', 'DOMICILIO')
                    .neq('estado', 'ENTREGADO')
                    .order('creado_en', { ascending: false });

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div style="background:var(--bg-card); padding:2rem 1rem; text-align:center; border-radius:14px; color:var(--text-dim); border:1px solid var(--border-subtle);">
                            <p style="font-size:2rem;">🎉</p>
                            <p style="font-weight:800; color:var(--text-white); margin-top:0.4rem;">No hay entregas pendientes</p>
                            <p style="font-size:0.75rem; margin-top:2px;">Te notificaremos cuando el panel asigne una nueva entrega.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = data.map(ord => {
                    const encodedAddr = encodeURIComponent((ord.direccion_entrega || 'Heredia, Costa Rica') + ', Costa Rica');
                    return `
                        <div class="order-delivery-card">
                            <div class="order-card-head">
                                <div>
                                    <div style="font-size:0.95rem; font-weight:900;">#${ord.id} • ${ord.nombre_contacto}</div>
                                    <div style="font-size:0.72rem; color:#f59e0b; font-weight:700;">⏰ Horario: ${ord.horario_rango}</div>
                                </div>
                                <span style="font-weight:900; color:#34d399; font-size:1.05rem;">₡${Number(ord.total_a_pagar).toLocaleString('es-CR')}</span>
                            </div>

                            <div style="background:var(--bg-input); padding:0.65rem 0.85rem; border-radius:10px; font-size:0.78rem;">
                                <div style="color:var(--text-muted);">📍 <b>Dirección:</b> ${ord.direccion_entrega || 'Coordinar con cliente'}</div>
                                <div style="color:var(--text-dim); margin-top:2px;">💳 <b>Pago:</b> ${ord.forma_pago}</div>
                                ${ord.notas_cliente ? `<div style="color:#fef08a; margin-top:2px;">📝 <b>Notas:</b> ${ord.notas_cliente}</div>` : ''}
                            </div>

                            <div style="display:flex; gap:0.4rem;">
                                <a href="https://waze.com/ul?q=${encodedAddr}&navigate=yes" target="_blank" class="btn-nav-action btn-waze" style="text-decoration:none;">
                                    🚗 Waze
                                </a>
                                <a href="https://www.google.com/maps/dir/?api=1&destination=${encodedAddr}" target="_blank" class="btn-nav-action btn-maps" style="text-decoration:none;">
                                    🗺️ Maps
                                </a>
                                <a href="https://api.whatsapp.com/send?phone=${ord.telefono_contacto}&text=Hola%20${encodeURIComponent(ord.nombre_contacto)},%20soy%20el%20repartidor%20de%20Country%20House,%20voy%20en%20camino%20con%20tu%20pedido%20🛵" target="_blank" class="btn-nav-action btn-wa-client" style="text-decoration:none;">
                                    💬 Contactar
                                </a>
                            </div>

                            <button class="btn-delivered" onclick="marcarEntregado('${ord.id}')">
                                ✓ Confirmar Pedido Entregado
                            </button>
                        </div>
                    `;
                }).join('');
            } catch(e) {
                console.warn(e);
            }
        }

        async function marcarEntregado(orderId) {
            if (!confirm(`¿Confirmas que el pedido #${orderId} fue entregado exitosamente?`)) return;
            if (supabaseClient) {
                await supabaseClient.from('pedidos').update({ estado: 'ENTREGADO' }).eq('id', orderId);
            }
            alert(`🎉 ¡Pedido #${orderId} marcado como entregado!`);
            cargarPedidosRepartidor();
        }

        function iniciarRealtimeRepartidor() {
            if (!supabaseClient) return;
            supabaseClient
                .channel('repartidor:pedidos')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, payload => {
                    cargarPedidosRepartidor();
                })
                .subscribe();
        }

        initMap();
        cargarPedidosRepartidor();
        iniciarRealtimeRepartidor();
    </script>
</body>
</html>
